<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Static English fallback for crawlers and pre-hydration; DocumentMeta updates title, description, and lang client-side. -->
    <script>
      (function () {
        var stored = localStorage.getItem("dsavision-locale");
        if (stored === "es") {
          document.documentElement.lang = "es";
        }
      })();
    </script>
    <title>DSA Vision - Interactive Algorithm & Data Structure Visualizer</title>
    <meta name="description" content="DSA Vision is an interactive platform for mastering Data Structures and Algorithms through real-time visualizers. Practice Binary Search, Quicksort, Linear Search, Merge Sort, and more." />
    <meta name="author" content="DSA Vision" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.dsavision.dev/" />

    <meta name="theme-color" content="#2563EB" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DSA Vision" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DSA Vision" />
    <meta property="og:url" content="https://www.dsavision.dev/" />
    <meta property="og:title" content="DSA Vision - Interactive Algorithm & Data Structure Visualizer" />
    <meta property="og:description" content="DSA Vision is an interactive platform for mastering Data Structures and Algorithms through real-time visualizers. Practice Binary Search, Quicksort, Linear Search, Merge Sort, and more." />

    <meta name="twitter:url" content="https://www.dsavision.dev/" />
