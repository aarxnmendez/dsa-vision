    <!-- Static English fallback for crawlers and pre-hydration; DocumentMeta updates title, description, and lang client-side. -->
    <script>
      (function () {
        var stored = localStorage.getItem("dsavision-locale");
        if (stored === "es") {
          document.documentElement.lang = "es";
        }
      })();
    </script>
    <title>DSAVision - Interactive Algorithm & Data Structure Visualizer</title>
    <meta name="description" content="Master Data Structures and Algorithms with interactive, gamified visualizers. Learning made tactile." />

    <meta name="theme-color" content="#2563EB" />

    <meta name="apple-mobile-web-app-title" content="DSAVision" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
